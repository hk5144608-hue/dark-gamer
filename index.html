<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
body{
    background-image: url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    font-family: Arial, sans-serif;
}

.box{
    width: 350px;
    margin: 120px auto;
    padding: 30px;
    border-radius: 15px;
    background-color: rgba(255,255,255,0.7);
    text-align: center;
    border: 3px solid black;
}

h1{
    color: darkblue;
}

input{
    width: 90%;
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
    border: 1px solid black;
}

button{
    padding: 10px 25px;
    border: none;
    border-radius: 8px;
    background-color: black;
    color: white;
    cursor: pointer;
}

button:hover{
    background-color: darkblue;     
    
}
</style>
</head>

<body>

<div class="box">
    <h1>DarkGamer Login</h1>

    <input type="text" placeholder="Enter Username">

    <input type="password" placeholder="Enter Password">

    <button>Login</button>
</div>

</body>
</html>
